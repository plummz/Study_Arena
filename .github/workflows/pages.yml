name: Deploy Study Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          STUDY_ARENA_API_URL: ${{ vars.STUDY_ARENA_API_URL }}
        run: |
          mkdir -p _site
          cp -R web/. _site/
          node -e 'const fs=require("fs"); const value=process.env.STUDY_ARENA_API_URL || ""; fs.writeFileSync("_site/runtime-config.js", `// Public configuration only. Never place API keys or secrets in this file.\nglobalThis.STUDY_ARENA_API_URL = ${JSON.stringify(value)};\n`);'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
