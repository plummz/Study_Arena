name: Deploy Study Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          STUDY_ARENA_API_URL: ${{ vars.STUDY_ARENA_API_URL || 'https://study-arena-api-production.up.railway.app' }}
        run: |
          mkdir -p _site
          cp -R web/. _site/
          node -e 'const fs=require("fs"); const value=(process.env.STUDY_ARENA_API_URL || "").replaceAll("&", "&amp;").replaceAll("\"", "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); const file="_site/index.html"; fs.writeFileSync(file, fs.readFileSync(file,"utf8").replace("name=\"study-arena-api\" content=\"\"", `name=\"study-arena-api\" content=\"${value}\"`));'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
