html/head_include="<meta name=\"theme-color\" content=\"#10101a\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>#sa-rotate{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#10101a;color:#f3eede;font:600 18px system-ui,sans-serif;text-align:center;padding:24px}#sa-rotate b{font-size:52px;line-height:1}#sa-rotate small{font-weight:400;opacity:.75}@media (orientation:portrait) and (pointer:coarse){#sa-rotate{display:flex}}</style><script>(function(){if(!matchMedia('(pointer:coarse)').matches)return;function lock(){var d=document.documentElement;var p=(!document.fullscreenElement&&d.requestFullscreen)?d.requestFullscreen({navigationUI:'hide'}):null;Promise.resolve(p).then(function(){if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(function(){});}document.addEventListener('pointerdown',lock,{capture:true,passive:true});document.addEventListener('DOMContentLoaded',function(){var r=document.createElement('div');r.id='sa-rotate';r.setAttribute('role','dialog');r.setAttribute('aria-label','Rotate to landscape');r.innerHTML='<b>&#10227;</b>Tap to play in landscape<small>If the screen does not turn, rotate your phone sideways.</small>';document.body.appendChild(r);});})();</script>"
